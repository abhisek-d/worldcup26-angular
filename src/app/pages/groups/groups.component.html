<div class="page-header">
  <h2>Groups</h2>
  <p class="subtitle">12 groups — 4 teams each</p>
</div>

<div *ngIf="loading" class="state-box">
  <div class="spinner"></div>
  <p>Loading groups…</p>
</div>

<div *ngIf="!loading && error" class="error-box">{{ error }}</div>

<ng-container *ngIf="!loading && !error">
  <div class="groups-grid">
    <div *ngFor="let g of groups" class="group-card">

      <div class="group-title">Group {{ g.name }}</div>

      <div class="table-header">
        <span class="col-team">Team</span>
        <span class="col-stat">MP</span>
        <span class="col-stat">W</span>
        <span class="col-stat">D</span>
        <span class="col-stat">L</span>
        <span class="col-stat">GF</span>
        <span class="col-stat">GA</span>
        <span class="col-stat">GD</span>
        <span class="col-stat pts">Pts</span>
        <span class="col-last5">Last 5</span>
      </div>

      <div *ngFor="let t of g.teams; let i = index"
           class="team-row"
           [class.qualified]="i < 2">
        <div class="col-team team-info">
          <span class="position">{{ i + 1 }}</span>
          <img *ngIf="getFlag(t.team_id)" [src]="getFlag(t.team_id)" [alt]="getName(t.team_id)" class="flag" />
          <span class="team-name">{{ getName(t.team_id) }}</span>
        </div>
        <span class="col-stat">{{ t.mp }}</span>
        <span class="col-stat">{{ t.w }}</span>
        <span class="col-stat">{{ t.d }}</span>
        <span class="col-stat">{{ t.l }}</span>
        <span class="col-stat">{{ t.gf }}</span>
        <span class="col-stat">{{ t.ga }}</span>
        <span class="col-stat">{{ t.gd }}</span>
        <span class="col-stat pts">{{ t.pts }}</span>
        <div class="col-last5 form-row">
          <span
            *ngFor="let r of getForm(t.team_id)"
            class="form-dot"
            [class.win]="r === 'W'"
            [class.loss]="r === 'L'"
            [class.draw]="r === 'D'"
            [class.none]="r === 'N'"
            [title]="r === 'W' ? 'Win' : r === 'L' ? 'Loss' : r === 'D' ? 'Draw' : 'Not played'">
          </span>
        </div>
      </div>

    </div>
  </div>
</ng-container>
