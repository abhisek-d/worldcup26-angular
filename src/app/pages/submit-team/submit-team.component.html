<div class="submit-page">
  <div class="submit-card">

    <!-- Form view -->
    <ng-container *ngIf="!submitted">
      <h2 class="title">Submit Your Team</h2>
      <p class="subtitle">You've selected {{ players.length }} players. Enter your details to submit.</p>

      <div *ngIf="players.length === 0" class="empty-warn">
        No players selected. Go back and pick your team.
      </div>

      <!-- Selected players preview -->
      <div *ngIf="players.length > 0" class="players-preview">
        <div class="preview-player" *ngFor="let p of players">
          <span class="pv-num">{{ p.number }}</span>
          <span class="pv-name">{{ p.name }}</span>
          <span class="pv-team">{{ p.teamName }}</span>
          <span class="pv-pos">{{ p.pos }}</span>
        </div>
      </div>

      <!-- Form -->
      <div class="form-group">
        <label for="teamName">Team Name</label>
        <input id="teamName" type="text" [(ngModel)]="teamName" placeholder="e.g. The Champions" />
      </div>

      <div class="form-group">
        <label for="email">Email ID</label>
        <input id="email" type="email" [(ngModel)]="email" placeholder="you@example.com" />
      </div>

      <div *ngIf="errorMsg" class="form-error">{{ errorMsg }}</div>

      <div class="actions">
        <button class="btn-secondary" (click)="goBack()">Back</button>
        <button class="btn-primary" [disabled]="players.length === 0" (click)="submit()">Submit Team</button>
      </div>
    </ng-container>

    <!-- Acknowledgement view -->
    <ng-container *ngIf="submitted">
      <div class="ack">
        <div class="ack-icon">✅</div>
        <h2 class="ack-title">Team Submitted!</h2>
        <p class="ack-text">
          Your team <strong>"{{ teamName }}"</strong> has been submitted successfully.
        </p>
        <button class="btn-primary" (click)="done()">Done</button>
      </div>
    </ng-container>

  </div>
</div>
